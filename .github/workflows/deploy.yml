name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # creates the project on the first run; on later runs the create
          # fails with "already exists" and is ignored
          preCommands: npx wrangler pages project create dontbeameatproxy --production-branch=main || true
          command: pages deploy . --project-name=dontbeameatproxy --branch=main
